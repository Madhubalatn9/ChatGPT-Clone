

{% extends 'base.html' %}
{% block content %}

<div class="name">
  <div class="name-hover">     
    <a href="#">AI-Bot</a>
  </div>
</div>

<div class="search-wrapper">
  <div class="home-page page">
    <div class="Intro" id="intro-heading">
      <p>Where should we begin?</p>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
  </div>

  <div class="search-main">
    <div class="search-bar">
      <form id="chat-form" action="{{ url_for('get_response') }}" method="POST">
        <div class="dropdown-symbol" id="dropdown-symbol">
          <button type="button" class="icon-plus" id="plus-btn" aria-label="Add attachment">  
            <i class="bi bi-plus"></i> 
          </button>
          <ul class="dropdown-list" id="dropdown-menu">
            <li class="dropdown-list-item" id="add-image-option">
              <i class="bi bi-image"></i>
              <span>Add Images</span>
            </li>
            <li class="dropdown-list-item" id="add-file-option">
              <i class="bi bi-paperclip"></i>
              <span>Add Files</span>
            </li>
          </ul>
          <input type="file" id="image-upload" class="file-upload" accept="image/*" style="display: none;"/>
          <input type="file" id="file-upload" class="file-upload" style="display: none;"/>
        </div>

        <div id="attachment-preview" class="attachment-preview" style="display: none;">
          <img id="preview-img" src="" alt="Preview" class="preview-img" style="display: none;" />
          <div id="file-icon-badge" class="file-icon-badge" style="display: none;">
            <i class="bi bi-file-earmark-text"></i>
          </div>
          <span id="preview-filename" class="preview-filename"></span>
          <button type="button" id="remove-attachment-btn" class="remove-attachment-btn" aria-label="Remove attachment">&times;</button>
        </div>

        <input type="text" id="user-input" name="input-area" placeholder="Ask anything" autocomplete="off" />
        <button type="button" class="icon-mic" aria-label="Voice input">
          <i class="bi bi-mic"></i>
        </button>
        <button type="submit" id="send-btn" class="submit-btn" aria-label="Send message">
          <i class="bi bi-arrow-up-short"></i>
        </button>
      </form>
    </div>
  </div>
  <div class="message user-message">
  <span class="message-bubble">
    <!-- <i class="bi bi-chat-right"></i> -->
  </span>
  <!-- <div class="msg-text">Hello there!</div> -->
</div>
</div>

<script src="{{ url_for('static', filename='JS/script.js') }}?v=1.2"></script>

{% endblock %}
