{% extends 'base.html' %}
{% block content %}
<div class="split-right">
    <div class="library-content-wrapper">
        <div class="library-top-menu">
        <div class="library-title">
            <p>Library</p>
        </div>
        <div class="right-controls">
        <form>
        <div class="library-search-bar">
            <button class="search-btn"><i class="bi bi-search"></i></button>
            <input type="text" placeholder="Search">
        </div>
        </form>
        
        
    
    <div class="new-dropdown">
        <a href="#">New</a>
        <span class="gt" onclick="newShowFunction()"><a href="#">&gt;</a></span>
         </div>
        <ul class="new-dropdown-list" id="newDropdownList">
            <li class="list1"><a href="#"><i class="bi bi-upload"></i> <span>Upload</span></a></li>
            <li class="list1"><a href="#"><i class="bi bi-folder"></i> <span>Folder</span></a></li>
            <li class="list1"><a href="#"><i class="bi bi-card-text"></i> <span>Note</span></a></li>
        </ul>
        </div>
        </div>
        <div class="library-toolbar">
      <div class="filter-pills">
        <button class="pill-btn active">All</button>
        <button class="pill-btn">Images</button>
        <button class="pill-btn">Documents</button>
      </div>
        
        <div class="library-icon">
           <span><div class="filter-icon"> <i class="bi bi-filter"></i></div></span>
           <span><div class="grid-icon"> <i class="bi bi-grid"></i></div></span>
           <span><div class="task-icon"> <i class="bi bi-list-task"></i></div></span>
        </div>
        </div>

        <div class="library-table">
            <table>
                <thead>
                <tr>
                    <th class="col-name">Name</th>
                    <th class="col-modified">Modified</th>
                    <th class="col-size">Size</th>
                </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-name">
                            <div class="file-info">
                                <div class="file-thumb">
                                    <i class="bi bi-file-earmark-image"></i>
                                </div>
                                <span class="file-name">image-1785958107666.jpg</span>
                            </div>
                        </td>
                        <td class="col-modified">Aug 6</td>

                        <td class="col-size">103 KB</td>
                    </tr>
                    <tr>
                        <td class="col-name">
                            <div class="file-info">
                                <div class="file-thumb">
                                    <i class="bi bi-file-earmark-image"></i>
                                </div>
                                <span class="file-name">image-1785958107666.jpg</span>
                            </div>
                        </td>
                        <td class="col-modified">Aug 6</td>

                        <td class="col-size">94.8 KB</td>
                    </tr>

                </tbody>
            </table>
        </div>
   

</div>
</div>
<script src="../static/JS/script.js"></script>
{% endblock %}
