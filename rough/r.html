<div class="search-bar">
      <form id="chat-form" action="{{ url_for('get_response') }}" method="POST" onsubmit="return false;">

            <i class="bi bi-plus"></i>  
        </button>
        <div class="input-area">
          <input type="text" id="user-input" name="input-area" placeholder="Ask anything" autocomplete="off" />
          <button type="button" class="icon-mic">
              <i class="bi bi-mic"></i>
          </button>

        </div>

    <div class="ai-output"></div>

</html>
<script>

const ai_response=document.getElementsByClassName("ai-output");
const speed=50;

function typeWriter(text,index){
    if(index<text.length){
        ai_response.textContent+=text.charAt(index);
        index++;
        setTimeout(() => typeWriter(text, index), speed);

    }
    let text="What is JS";
    typeWriter(text,0);
  }
    </script>
